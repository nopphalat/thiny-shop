<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>THINY SHOP · ระบบจัดการขาย + ร้านค้าออนไลน์</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Noto+Sans+Lao:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&family=Caveat:wght@500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css"/>
  <link rel="stylesheet" href="styles-shop.css"/>

  <style>
    /* ============== LO-FI PAGE CHROME ============== */
    :root {
      --paper-1: #F4ECDD;
      --paper-2: #EDE2CC;
      --paper-ink: #2A2520;
      --paper-ink-2: #5B4F3F;
      --paper-ink-3: #8C7B62;
      --paper-line: #DBCEB1;
      --paper-accent: #C8553D;  /* terracotta */
      --paper-accent-2: #1F6F4A; /* forest */
      --paper-accent-3: #C77100; /* mustard */
    }
    .dark {
      --paper-1: #1A1612;
      --paper-2: #221C16;
      --paper-ink: #F4ECDD;
      --paper-ink-2: #C4B59A;
      --paper-ink-3: #897868;
      --paper-line: #38302A;
    }

    body {
      background: #F4F4F0;
      font-family: "Inter", "IBM Plex Sans Thai", "Noto Sans Lao", system-ui, sans-serif;
      color: var(--paper-ink);
    }
    body.dark { background: #0F0F12; }

    /* Page background: clean, no texture or warm-light glow */
    .page-wrap {
      min-height: 100vh;
      position: relative;
    }

    .stage {
      position: relative;
      z-index: 2;
      padding: 40px 36px 64px;
      max-width: none;
    }
    @media (max-width: 1280px) {
      .stage { padding: 28px 20px 48px; }
      .lofi-head {
        grid-template-columns: 1fr;
        gap: 18px;
      }
      .lofi-tagline { text-align: left; }
      .lofi-stamps { flex-direction: row; flex-wrap: wrap; align-items: flex-start; }
      .lofi-brand-name { font-size: 44px; }
    }
    @media (max-width: 720px) {
      .lofi-brand-name { font-size: 36px; }
      .lofi-brand-mark { width: 52px; height: 52px; font-size: 30px; }
    }

    /* ========== EDITORIAL HEADER ========== */
    .lofi-head {
      max-width: 1840px;
      margin: 0 auto 36px;
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 28px;
      align-items: end;
    }
    .lofi-brand {
      display: flex; align-items: flex-start; gap: 14px;
    }
    .lofi-brand-mark {
      width: 64px; height: 64px;
      background: var(--paper-ink);
      color: var(--paper-1);
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-family: "Instrument Serif", serif;
      font-size: 38px;
      font-weight: 400;
      font-style: italic;
      transform: rotate(-4deg);
      box-shadow:
        4px 4px 0 var(--paper-ink),
        4px 4px 16px rgba(42, 37, 32, 0.25);
      flex-shrink: 0;
    }
    .lofi-brand-text { padding-top: 4px; }
    .lofi-brand-name {
      font-family: "Instrument Serif", serif;
      font-size: 56px;
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 0.95;
      color: var(--paper-ink);
    }
    .lofi-brand-name em {
      font-style: italic;
      color: var(--paper-accent);
      font-weight: 400;
    }
    .lofi-brand-sub {
      font-family: "Caveat", cursive;
      font-size: 22px;
      color: var(--paper-ink-2);
      transform: rotate(-1.5deg);
      margin-top: -2px;
      margin-left: 8px;
    }

    .lofi-tagline {
      font-family: "Instrument Serif", serif;
      font-style: italic;
      font-size: 18px;
      color: var(--paper-ink-2);
      text-align: center;
      max-width: 380px;
      line-height: 1.4;
      padding-bottom: 8px;
    }

    .lofi-stamps {
      display: flex; flex-direction: column; gap: 10px; align-items: flex-end;
    }
    .lofi-stamp {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 14px;
      background: var(--paper-2);
      border: 1px dashed var(--paper-ink-3);
      border-radius: 100px;
      font-size: 11px;
      color: var(--paper-ink-2);
      font-weight: 500;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .lofi-stamp strong { color: var(--paper-ink); font-weight: 700; }
    .lofi-stamp-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--paper-accent-2); box-shadow: 0 0 8px var(--paper-accent-2); animation: pulse 2s infinite; }
    .lofi-stamp-date {
      font-family: "JetBrains Mono", monospace;
      font-size: 10px;
      padding: 4px 10px;
      background: var(--paper-ink);
      color: var(--paper-1);
      border-radius: 4px;
      letter-spacing: 0.05em;
      transform: rotate(2deg);
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

    /* ========== STAGE LAYOUT ========== */
    .stage-layout {
      max-width: 1840px;
      margin: 0 auto;
      display: grid;
      gap: 36px;
      align-items: start;
      position: relative;
    }
    .stage-layout.device-desktop.view-split { grid-template-columns: minmax(0, 1fr) 460px; }
    .stage-layout.device-desktop.view-admin,
    .stage-layout.device-desktop.view-shop { grid-template-columns: 1fr; }
    /* iPad / iPhone admin device — both wraps are fixed-size, center them */
    .stage-layout.device-ipad,
    .stage-layout.device-iphone {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: flex-start;
    }

    @media (max-width: 1280px) {
      .stage-layout.device-desktop.view-split { grid-template-columns: 1fr; }
    }

    /* ========== ADMIN CARD — lo-fi treatment ========== */
    .lofi-admin-wrap {
      position: relative;
      min-width: 0;
    }
    .lofi-admin-card {
      background: #FDFCF8;
      border-radius: 18px;
      overflow-y: hidden;
      overflow-x: auto;
      box-shadow:
        0 2px 0 var(--paper-ink),
        8px 8px 0 var(--paper-ink),
        8px 8px 40px rgba(42, 37, 32, 0.20),
        0 32px 80px rgba(42, 37, 32, 0.12);
      border: 1.5px solid var(--paper-ink);
      transform: rotate(-0.3deg);
      position: relative;
    }
    .dark .lofi-admin-card { background: #18181D; }
    .lofi-admin-card > .thiny-admin { border-radius: 16px; overflow: hidden; }

    /* === Admin in iPad/iPhone device frames === */
    .lofi-device-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      padding: 28px 24px 20px;
      background: #FDFCF8;
      border: 1.5px solid var(--paper-ink);
      border-radius: 22px;
      box-shadow:
        0 2px 0 var(--paper-ink),
        8px 8px 0 var(--paper-ink),
        8px 8px 40px rgba(42, 37, 32, 0.20),
        0 32px 80px rgba(42, 37, 32, 0.12);
      transform: rotate(-0.4deg);
      position: relative;
    }
    .dark .lofi-device-wrap { background: #18181D; }
    .lofi-device-wrap .ipad-wrap,
    .lofi-device-wrap .iphone-admin-wrap { transform: rotate(0.4deg); }
    .lofi-device-meta {
      display: flex; gap: 8px;
      font-family: "JetBrains Mono", monospace;
      font-size: 10px;
      color: var(--paper-ink-3);
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .lofi-device-meta span { padding: 3px 8px; background: var(--paper-2); border-radius: 4px; }
    .lofi-device-caption {
      font-family: "Caveat", cursive;
      font-size: 22px;
      color: var(--paper-ink-2);
      transform: rotate(-1deg);
      margin-top: -2px;
      text-align: center;
    }
    .lofi-tape {
      position: absolute;
      top: -14px; left: 80px;
      width: 100px; height: 26px;
      background: rgba(245, 186, 90, 0.5);
      transform: rotate(-3deg);
      box-shadow: 0 2px 8px rgba(42, 37, 32, 0.15);
      z-index: 5;
      backdrop-filter: blur(4px);
    }
    .lofi-tape::before, .lofi-tape::after {
      content: ""; position: absolute; top: 0; bottom: 0; width: 8px;
      background-image: linear-gradient(90deg, transparent 50%, rgba(0,0,0,0.08) 50%);
      background-size: 4px 100%;
    }
    .lofi-tape::before { left: 0; }
    .lofi-tape::after { right: 0; }
    .lofi-tape-2 {
      position: absolute;
      top: -10px; right: 120px;
      width: 80px; height: 22px;
      background: rgba(200, 85, 61, 0.4);
      transform: rotate(4deg);
      box-shadow: 0 2px 6px rgba(42, 37, 32, 0.12);
      z-index: 5;
    }

    .lofi-card-label {
      position: absolute;
      top: -16px; right: -10px;
      transform: rotate(6deg);
      background: var(--paper-ink);
      color: var(--paper-1);
      padding: 5px 14px;
      border-radius: 100px;
      font-family: "JetBrains Mono", monospace;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      box-shadow: 2px 2px 0 var(--paper-accent);
      z-index: 6;
    }

    /* ========== SHOP — lo-fi treatment ========== */
    .shop-wrap {
      display: flex; justify-content: center;
    }
    .stage-layout.device-desktop.view-split .shop-wrap {
      position: sticky; top: 28px;
    }
    @media (max-width: 1280px) {
      .stage-layout.device-desktop.view-split .shop-wrap { position: static; }
    }

    .lofi-shop-card {
      position: relative;
      display: flex; flex-direction: column; align-items: center; gap: 18px;
      padding: 28px 24px 20px;
      background: #FDFCF8;
      border: 1.5px solid var(--paper-ink);
      border-radius: 22px;
      box-shadow:
        0 2px 0 var(--paper-ink),
        -8px 8px 0 var(--paper-ink),
        -8px 8px 40px rgba(42, 37, 32, 0.20),
        0 32px 80px rgba(42, 37, 32, 0.12);
      transform: rotate(0.6deg);
    }
    .dark .lofi-shop-card { background: #18181D; }
    .lofi-shop-card .ios-wrap { transform: rotate(-0.6deg); }
    .lofi-shop-caption {
      font-family: "Caveat", cursive;
      font-size: 22px;
      color: var(--paper-ink-2);
      transform: rotate(-1deg);
      margin-top: -4px;
    }
    .lofi-shop-caption svg { display: inline-block; vertical-align: middle; margin-right: 4px; }
    .lofi-shop-meta {
      display: flex; gap: 8px;
      font-family: "JetBrains Mono", monospace;
      font-size: 10px;
      color: var(--paper-ink-3);
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .lofi-shop-meta span { padding: 3px 8px; background: var(--paper-2); border-radius: 4px; }
    .lofi-shop-arrow {
      position: absolute;
      top: -10px; right: -120px;
      font-family: "Caveat", cursive;
      font-size: 20px;
      color: var(--paper-accent);
      transform: rotate(8deg);
      white-space: nowrap;
      pointer-events: none;
    }
    @media (max-width: 1280px) {
      .lofi-shop-arrow { display: none; }
    }

    /* ========== FOOTER STRIP ========== */
    .lofi-footer {
      max-width: 1840px;
      margin: 48px auto 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 16px 24px;
      border-top: 1.5px dashed var(--paper-ink-3);
      font-family: "JetBrains Mono", monospace;
      font-size: 11px;
      color: var(--paper-ink-3);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .lofi-footer strong { color: var(--paper-ink); font-weight: 700; }
    .lofi-footer-marks { display: flex; gap: 16px; align-items: center; }
    .lofi-footer-mark {
      display: inline-flex; align-items: center; gap: 6px;
    }
    .lofi-footer-dot {
      width: 6px; height: 6px; border-radius: 50%; background: var(--paper-ink-3);
    }

    /* Loading */
    .loading { display: flex; align-items: center; justify-content: center; min-height: 100vh; color: var(--paper-ink-3); font-family: "Instrument Serif", serif; font-style: italic; font-size: 22px; }

    .ios-wrap { width: 402px; flex-shrink: 0; }

    /* When in dark mode, ensure the inner admin/shop respect their own theme rather than the cream paper */
    .lofi-admin-card .thiny-admin,
    .lofi-shop-card { color: initial; }
  </style>
</head>
<body>
  <div id="root">
    <div class="loading">Loading THINY SHOP…</div>
  </div>

  <!-- Splash / no-JS fallback used by the standalone bundler -->
  <template id="__bundler_thumbnail" data-bg-color="#F4F4F0">
    <svg viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
      <rect x="160" y="160" width="280" height="280" rx="56" fill="#0F4C81"/>
      <text x="300" y="400" font-family="Georgia, 'Times New Roman', serif" font-size="240" font-style="italic" fill="#FFFFFF" text-anchor="middle">T</text>
      <text x="300" y="500" font-family="Georgia, serif" font-size="40" fill="#2A2520" text-anchor="middle" letter-spacing="6">THINY SHOP</text>
    </svg>
  </template>

  <!-- Tweaks defaults — host rewrites this block on disk -->
  <script id="thiny-tweaks-defaults" type="application/json">
    /*EDITMODE-BEGIN*/{
      "dark": false,
      "accent": "navy",
      "lang": "th",
      "view": "split",
      "device": "desktop"
    }/*EDITMODE-END*/
  </script>

  <!-- Data and i18n -->
  <script src="src/data.js"></script>
  <script src="src/i18n.js"></script>

  <!-- React + Babel -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- Components -->
  <script type="text/babel" src="ios-frame.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="src/shared.jsx"></script>
  <script type="text/babel" src="src/admin-shell.jsx"></script>
  <script type="text/babel" src="src/admin-screens.jsx"></script>
  <script type="text/babel" src="src/admin-chat.jsx"></script>
  <script type="text/babel" src="src/shop.jsx"></script>

  <script type="text/babel" data-presets="env,react">

const { useState, useEffect } = React;

// Defaults (single source of truth for tweaks)
const TWEAK_DEFAULTS = JSON.parse(
  document.getElementById('thiny-tweaks-defaults').textContent.
  replace(/\/\*EDITMODE-BEGIN\*\//, '').
  replace(/\/\*EDITMODE-END\*\//, '')
);

function App() {
  const t = useTweaks(TWEAK_DEFAULTS);
  const lang = t.lang || "th";
  const langT = window.THINY_I18N[lang];
  const accClass = `acc-${t.accent || "navy"}`;
  const darkClass = t.dark ? "dark" : "";
  const view = t.view || "split";
  const device = t.device || "desktop";

  useEffect(() => {
    document.documentElement.lang = lang;
    document.body.className = `${darkClass} ${accClass} lang-${lang}`;
  }, [t.dark, t.accent, t.lang]);

  const showAdmin = view === "split" || view === "admin";
  const showShop = view === "split" || view === "shop";

  const adminInner = <AdminApp t={langT} lang={lang} />;
  const renderAdmin = () => {
    if (device === "ipad") {
      return (
        <div className="lofi-device-wrap">
              <div className="lofi-card-label">iPad · admin</div>
              <div className="lofi-device-meta">
                <span>iPad · 820×1180</span>
                <span>Manager</span>
              </div>
              <IPadDevice dark={t.dark}>{adminInner}</IPadDevice>
              <div className="lofi-device-caption">— sidebar ย่อเป็นไอคอน, tap ดูสินค้าได้ตามปกติ</div>
            </div>);

    }
    if (device === "iphone") {
      return (
        <div className="lofi-device-wrap">
              <div className="lofi-card-label">iPhone · admin</div>
              <div className="lofi-device-meta">
                <span>iOS · 402×874</span>
                <span>Manager · pocket</span>
              </div>
              <div className="iphone-admin-wrap">
                <IOSDevice width={402} height={874} dark={t.dark}>{adminInner}</IOSDevice>
              </div>
              <div className="lofi-device-caption">— เมนูย้ายไปแถบล่าง · จัดสต๊อกได้ขณะเดิน</div>
            </div>);

    }
    return (
      <div className="lofi-admin-wrap">
            <div className="lofi-tape"></div>
            <div className="lofi-tape-2"></div>
            <div className="lofi-card-label">Desktop · admin</div>
            <div className="lofi-admin-card">{adminInner}</div>
          </div>);

  };

  return (
    <div className="page-wrap">
          <div className="stage">
            <header className="lofi-head" style={{ fontFamily: "\"Noto Sans Thai\"" }}>
              <div className="lofi-brand">
                <div className="lofi-brand-mark">T</div>
                <div className="lofi-brand-text">
                  <div className="lofi-brand-name">Thiny <em>Shop</em></div>
                </div>
              </div>

              <div className="lofi-tagline" style={{ fontFamily: "\"Noto Sans Thai\"" }}>
                “จัดการสต๊อกหลายคลัง<br />เชื่อม Shopee · Lazada · TikTok<br />เปิดได้บน iPad &amp; iPhone.”
              </div>

              <div className="lofi-stamps">
                <span className="lofi-stamp"><span className="lofi-stamp-dot"></span><strong>Live</strong> prototype</span>
                <span className="lofi-stamp">{window.THINY_DATA.PRODUCTS.length} SKU &middot; {window.THINY_DATA.LOCATIONS.length} locations</span>
                <span className="lofi-stamp-date">No. 001 / MAY 20 · 2026</span>
              </div>
            </header>

            <main className={`stage-layout device-${device} view-${view}`}>
              {showAdmin && renderAdmin()}

              {showShop &&
          <div className="shop-wrap">
                  <div className="lofi-shop-card">
                    {device === "desktop" && view === "split" && <div className="lofi-shop-arrow">↗ ลูกค้าเปิดในมือถือ</div>}
                    <div className="lofi-shop-meta">
                      <span>iOS · 402×874</span>
                      <span>Customer</span>
                    </div>
                    <div className="ios-wrap">
                      <IOSDevice width={402} height={874} dark={t.dark}>
                        <ShopApp t={langT} lang={lang} />
                      </IOSDevice>
                    </div>
                    <div className="lofi-shop-caption">— เลื่อนดู &middot; แตะสินค้า &middot; ใส่ตะกร้าได้จริง</div>
                  </div>
                </div>
          }
            </main>

            <footer className="lofi-footer">
              <div className="lofi-footer-marks">
                <span className="lofi-footer-mark"><strong>THINY</strong> SHOP</span>
                <span className="lofi-footer-dot"></span>
                <span>Vol. 01 · Issue 26</span>
                <span className="lofi-footer-dot"></span>
                <span>Made with paper &amp; pixels</span>
              </div>
              <div className="lofi-footer-marks">
                <span>Press <strong>Tweaks</strong> →</span>
                <span className="lofi-footer-dot"></span>
                <span>TH · EN · ລາວ</span>
              </div>
            </footer>
          </div>

          <TweaksPanel title="Tweaks · THINY SHOP">
            <TweakSection label="Admin device">
              <TweakRadio
            label="Show on"
            value={device}
            options={[
            { label: 'Desktop', value: 'desktop' },
            { label: 'iPad', value: 'ipad' },
            { label: 'iPhone', value: 'iphone' }]
            }
            onChange={(v) => t.setTweak('device', v)} />
          
            </TweakSection>
            <TweakSection label="Theme">
              <TweakToggle
            label="Dark mode"
            value={t.dark}
            onChange={(v) => t.setTweak('dark', v)} />
          
              <TweakRadio
            label="Accent"
            value={t.accent}
            options={[
            { label: 'Navy', value: 'navy' },
            { label: 'Forest', value: 'forest' },
            { label: 'Coral', value: 'coral' }]
            }
            onChange={(v) => t.setTweak('accent', v)} />
          
            </TweakSection>
            <TweakSection label="Language">
              <TweakRadio
            label="UI language"
            value={t.lang}
            options={[
            { label: 'ไทย', value: 'th' },
            { label: 'English', value: 'en' },
            { label: 'ລາວ', value: 'lo' }]
            }
            onChange={(v) => t.setTweak('lang', v)} />
          
            </TweakSection>
            <TweakSection label="Layout">
              <TweakRadio
            label="View"
            value={view}
            options={[
            { label: 'Both', value: 'split' },
            { label: 'Admin', value: 'admin' },
            { label: 'Shop', value: 'shop' }]
            }
            onChange={(v) => t.setTweak('view', v)} />
          
            </TweakSection>
          </TweaksPanel>
        </div>);

}

// ============= iPad device frame (inline) =============
function IPadDevice({ children, dark = false, width = 820, height = 1180 }) {
  const bezel = 26;
  return (
    <div style={{
      width: width + bezel * 2,
      height: height + bezel * 2,
      borderRadius: 40,
      background: dark ? "#0F0F12" : "#1C1C1E",
      padding: bezel,
      boxShadow: "0 24px 60px rgba(0,0,0,0.28), inset 0 0 0 1.5px rgba(255,255,255,0.05), 0 0 0 1.5px rgba(0,0,0,0.6)",
      boxSizing: "content-box",
      position: "relative",
      fontFamily: "-apple-system, system-ui, sans-serif"
    }}>
          <div style={{
        position: "absolute", top: bezel / 2 - 3, left: "50%",
        transform: "translateX(-50%)",
        width: 6, height: 6, borderRadius: "50%",
        background: "#0A0A0A", boxShadow: "inset 0 0 0 1px rgba(255,255,255,0.08)"
      }} />
          <div style={{
        width, height, borderRadius: 6,
        overflow: "hidden",
        background: dark ? "#000" : "#fff",
        position: "relative"
      }}>
            {children}
          </div>
        </div>);

}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
