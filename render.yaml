services:
  # ===== Backend API =====
  - type: web
    name: thiny-shop-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: singapore
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: https://thiny-shop.pages.dev,https://thiny-shop.onrender.com
      - key: TURSO_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false

  # ===== Frontend Static Site (no region — served globally via CDN) =====
  - type: web
    name: thiny-shop
    runtime: static
    buildCommand: ""
    staticPublishPath: ./
    autoDeploy: true
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache, must-revalidate
      - path: /src/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
